# Ambiente de TESTE acessado só por IP:porta, sem domínio e sem HTTPS (o Caddy não sobe).
# Use apenas com dados fictícios: sem HTTPS, senhas e dados trafegam sem criptografia.
#   docker compose -f docker-compose.yml -f docker-compose.ip.yml up -d --build
# No .env: DOMINIO=<ip>, PORTA=<porta>.
services:
  web:
    ports:
      - "${PORTA:-8900}:3000"
    environment:
      APP_URL: http://${DOMINIO}:${PORTA:-8900}
      COOKIE_SEGURO: "0"

  worker:
    environment:
      APP_URL: http://${DOMINIO}:${PORTA:-8900}

  caddy:
    profiles: ["dominio"]
