<div class="m" style="width:390px;height:844px;background:#F4F5F2;display:flex;flex-direction:column;overflow:hidden">
<header style="display:flex;align-items:center;gap:8px;padding:14px 10px 6px">
<a href="MoradorInicio.dc.html" aria-label="Voltar" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:#14181F"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<h1 class="hd" style="margin:0;font-size:20px;font-weight:600">Cadastrar locatário</h1>
</header>
<div style="flex:1;overflow-y:auto;padding:8px 18px 18px;display:flex;flex-direction:column;gap:16px">
<div style="display:flex;gap:4px;background:#E7E9E4;border-radius:12px;padding:4px" role="tablist" aria-label="Tipo de locação">
<button class="{{tempCls}}" role="tab" sc-camel-on-click="{{setTemp}}">Temporada</button>
<button class="{{alugCls}}" role="tab" sc-camel-on-click="{{setAlug}}">Aluguel</button>
</div>

<sc-if value="{{isTemp}}" hint-placeholder-val="{{true}}">
<label class="fld">Responsável pela reserva<input class="inp" value="Marina Souza"></label>
<label class="fld">Celular (para o link facial)<input class="inp" value="(41) 9 9812-3344"></label>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<label class="fld">Check-in<input class="inp" value="22/11 · 14h"></label>
<label class="fld">Check-out<input class="inp" value="25/11 · 11h"></label>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<label class="fld">Hóspedes<sc-raw-select class="inp"><option>2</option><option>3</option><option>4</option></sc-raw-select></label>
<label class="fld">Origem<sc-raw-select class="inp"><option>Airbnb</option><option>Booking</option><option>Direto</option></sc-raw-select></label>
</div>
<div style="display:flex;gap:12px;background:#F3FAF8;border:1px solid #CFE6E1;border-radius:12px;padding:12px">
<svg width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"></path></svg>
<span style="font-size:13px">Cada hóspede recebe um link para cadastrar a facial. O acesso vale só entre check-in e check-out, e a foto é apagada depois.</span>
</div>
</sc-if>

<sc-if value="{{isAlug}}" hint-placeholder-val="{{false}}">
<label class="fld">Nome do locatário<input class="inp" placeholder="Nome completo"></label>
<label class="fld">Celular<input class="inp" placeholder="(00) 9 0000-0000"></label>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<label class="fld">Início do contrato<input class="inp" placeholder="dd/mm/aaaa"></label>
<label class="fld">Fim do contrato<input class="inp" placeholder="dd/mm/aaaa"></label>
</div>
<label class="fld">Imobiliária (opcional)<input class="inp" placeholder="Nome da imobiliária"></label>
<label class="fld">Moradores da unidade<sc-raw-select class="inp"><option>1 pessoa</option><option>2 pessoas</option><option>3 pessoas</option><option>4 ou mais</option></sc-raw-select></label>
<button class="up"><span style="width:36px;height:36px;border-radius:9px;background:#FBE6E4;color:#9A1B1B;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">PDF</span>Anexar contrato de locação</button>
</sc-if>
</div>
<div style="padding:12px 18px 24px;background:#fff;border-top:1px solid #E2E4DF">
<button class="btn pri">{{cta}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 'temp' }; }
  renderVals() {
    const temp = this.state.t === 'temp';
    return {
      isTemp: temp, isAlug: !temp,
      tempCls: temp ? 'seg on' : 'seg', alugCls: temp ? 'seg' : 'seg on',
      setTemp: () => this.setState({ t: 'temp' }), setAlug: () => this.setState({ t: 'alug' }),
      cta: temp ? 'Enviar para aprovação e links faciais' : 'Enviar para aprovação'
    };
  }
}
</script>


</body></html>
