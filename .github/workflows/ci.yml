name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["55339:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_CRYPTO_KEY: chave-de-ci-0123456789abcdef0123456789abcdef
      GC_APP_PASSWORD: senha-do-gc-app-no-ci-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regras de negócio (Vitest)
        run: pnpm --filter @gc/core test
      - name: Auth, RLS e LGPD no Postgres (Vitest)
        run: pnpm --filter @gc/db test
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build do painel
        run: pnpm --filter @gc/web build
      - run: pnpm --filter @gc/web exec playwright install --with-deps chromium
      - name: E2E — modo demonstração
        run: pnpm --filter @gc/web test:e2e
      - name: E2E — Postgres real (login, 2FA, RLS, link facial)
        env:
          DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:55339/gc_e2e
          DATABASE_URL: postgres://gc_app:senha-do-gc-app-no-ci-123@127.0.0.1:55339/gc_e2e
          STORAGE_DIR: /tmp/gc-arquivos
        run: |
          psql postgres://postgres:postgres@127.0.0.1:55339/postgres -c "create database gc_e2e"
          pnpm --filter @gc/db migrate && pnpm --filter @gc/db seed && pnpm --filter @gc/db app-user
          (cd apps/web && pnpm exec next start -p 3300 &) && npx --yes wait-on http://localhost:3300/login
          pnpm --filter @gc/web test:e2e:real

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target web -t gestacondominio-web .
      - run: docker build --target tools -t gestacondominio-tools .
